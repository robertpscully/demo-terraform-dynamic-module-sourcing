name: Terraform Docs

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/hcpt/**'
      - 'terraform/modules/**'
      - '.github/workflows/tfdocs.yml'

permissions:
  contents: write

jobs:
  tfdocs:
    name: Generate Terraform docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Generate terraform docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: terraform/hcpt,terraform/modules
          output-file: README.md
          output-method: inject
          git-push: 'false'
          recursive: true
          recursive-path: .

      - name: Check for doc changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Commits via the GraphQL createCommitOnBranch mutation instead of `git push`,
      # so GitHub signs the commit server-side and it shows up as Verified.
      - name: Commit doc changes as a verified commit
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const changedFiles = execSync('git status --porcelain')
              .toString()
              .trim()
              .split('\n')
              .map((line) => line.slice(3));

            const headOid = execSync('git rev-parse HEAD').toString().trim();
            const branch = context.payload.pull_request.head.ref;

            const additions = changedFiles.map((path) => ({
              path,
              contents: fs.readFileSync(path).toString('base64'),
            }));

            await github.graphql(
              `mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid }
                }
              }`,
              {
                input: {
                  branch: {
                    repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                    branchName: branch,
                  },
                  message: { headline: 'docs: regenerate terraform-docs output' },
                  expectedHeadOid: headOid,
                  fileChanges: { additions },
                },
              }
            );
